<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="viewport" content="width=device-width, user-scalable=no" />
    <title>Rapido</title>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/statics/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/statics/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/statics/favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="/statics/favicon/site.webmanifest" />
    <link
      rel="mask-icon"
      href="/statics/favicon/safari-pinned-tab.svg"
      color="#22d3ee"
    />
    <link rel="shortcut icon" href="/statics/favicon/favicon.ico" />
    <meta name="apple-mobile-web-app-title" content="Rapido" />
    <meta name="application-name" content="Rapido" />
    <meta name="msapplication-TileColor" content="#0a1116" />
    <!-- Vite's HTML asset-rewriting only patches recognized tag/attribute
         pairs (link href, script src, img src, ...) to carry the "/dashboard/"
         base at build time - a bare <meta content="..."> URL isn't on that
         list, so this one path is spelled out by hand to match. -->
    <meta name="msapplication-config" content="/dashboard/statics/favicon/browserconfig.xml" />
    <meta name="theme-color" content="#0a1116" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
