# Full Rapido-Go panel stack, pre-built images only. Not meant to be run by
# hand - see rapido-go.sh (bash <(curl -fsSL
# https://raw.githubusercontent.com/legendary1205/rapido-go/master/rapido-go.sh)
# install), which downloads this file (and the script itself) into
# /opt/rapido-go, writes .env and Caddyfile, and drives this with
# `docker compose -f docker-compose.prod.yml --env-file .env up -d`.
#
# This is separate from the root docker-compose.yml on purpose: that one is
# for local development (just Postgres+Redis, so `go run ./cmd/panel` can
# run against them with your own code) - mixing these pre-built panel/
# backend/caddy containers into that file would fight a locally-run dev
# process for the same ports.
#
# Images are published privately to ghcr.io by .github/workflows/
# docker-publish.yml on every push to master - rapido-go.sh runs
# `docker login ghcr.io` for you if RAPIDO_REPO_TOKEN is set (the same
# token used to clone the private source, since a token with read access
# to the repo also has read:packages on its own images by default).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rapido
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rapido}
      POSTGRES_DB: rapido
    # Tuned instead of stock defaults (which assume a tiny machine: 128 MB of
    # shared buffers, JIT on, spinning-disk cost model). The two memory
    # settings come from .env - rapido-go.sh sizes them from this machine's
    # RAM at install time (about 25% and 60%); the defaults below suit a
    # 1-2 GB VPS. Everything else is safe for any SSD-backed server.
    # log_min_duration_statement logs any query slower than 500 ms, so a slow
    # query shows up in `rapido-go logs postgres` instead of going unnoticed.
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1GB}
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - jit=off
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - wal_compression=on
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=2GB
      - -c
      - log_min_duration_statement=500
      - -c
      - max_connections=100
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rapido"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis is a pure cache here - nothing in the panel needs it to survive a
  # restart (cache-aside reads that fall through to Postgres on a miss, a
  # per-IP login rate-limit counter, short-lived peer-status entries, Telegram
  # console sessions, a maintenance flag that only lives for the length of one
  # restore). So it
  # never writes to disk: no RDB snapshots (they re-saved a large,
  # constantly-rewritten cache key over and over - gigabytes of pointless
  # disk writes) and no append-only file. maxmemory bounds it and
  # allkeys-lru evicts the least recently used entry first.
  # The redis_data volume below is kept only so an existing install does not
  # orphan it; with persistence off nothing new is written to it.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies pending migrations and exits - panel/backend wait for this to
  # finish successfully before they start, so a fresh `up -d` always comes
  # up against an up-to-date schema with no separate manual step.
  migrate:
    image: ${RAPIDO_IMAGE:-ghcr.io/legendary1205/rapido-go-panel}:${RAPIDO_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["goose", "-dir", "/app/internal/db/migrations", "postgres"]
    command: ["postgres://rapido:${POSTGRES_PASSWORD:-rapido}@postgres:5432/rapido?sslmode=disable", "up"]
    restart: "no"

  panel:
    image: ${RAPIDO_IMAGE:-ghcr.io/legendary1205/rapido-go-panel}:${RAPIDO_TAG:-latest}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # No published port here - only caddy (below) is reachable from outside,
    # same reasoning as the Python-era panel's own single-entrypoint design:
    # one place terminates TLS, everything else is only reachable through it.
    expose:
      - "8000"
    environment:
      ROLE: api
      DATABASE_URL: postgres://rapido:${POSTGRES_PASSWORD:-rapido}@postgres:5432/rapido?sslmode=disable
      REDIS_ADDR: redis:6379
      SUDO_USERNAME: ${SUDO_USERNAME:-admin}
      SUDO_PASSWORD: ${SUDO_PASSWORD:?set SUDO_PASSWORD in your .env file - this is the one-time bootstrap login, see the README}
      PUBLIC_IP: ${PUBLIC_IP:-}
      # Days of usage history to keep.
      USAGE_RETENTION_DAYS: ${USAGE_RETENTION_DAYS:-90}
      XRAY_SUBSCRIPTION_URL_PREFIX: ${XRAY_SUBSCRIPTION_URL_PREFIX:-}
      # Optional: every address a subscription answers on, comma-separated, in
      # the order the dashboard lists them. The first one is also what
      # `subscription_url` (what reseller bots read) uses, overriding
      # XRAY_SUBSCRIPTION_URL_PREFIX.
      XRAY_SUBSCRIPTION_URL_PREFIXES: ${XRAY_SUBSCRIPTION_URL_PREFIXES:-}
      # Customer-visible: real VPN clients render these as the in-app
      # support button and the profile's name (see .env.prod.example).
      SUB_SUPPORT_URL: ${SUB_SUPPORT_URL:-https://t.me/}
      SUB_PROFILE_TITLE: ${SUB_PROFILE_TITLE:-Subscription}
      SUB_UPDATE_INTERVAL: ${SUB_UPDATE_INTERVAL:-12}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      # Both empty by default (no override - see internal/subscription's
      # ClashConfig/V2rayJSONConfig doc comments for the built-in minimal
      # fallback that produces). Point these at real files bind-mounted
      # from ./templates (below) to serve a fully customized Clash/
      # v2ray-json profile - dns/tun/rule-provider settings, a branded
      # proxy-group, local inbounds/routing - instead of the bare minimum
      # that only guarantees the profile can route traffic at all.
      CLASH_SUBSCRIPTION_TEMPLATE: ${CLASH_SUBSCRIPTION_TEMPLATE:-}
      V2RAY_SUBSCRIPTION_TEMPLATE: ${V2RAY_SUBSCRIPTION_TEMPLATE:-}
      # All false by default (every real client gets the universal v2ray
      # share-link format) - matching each flag's own real shipped
      # default. Turn one on only for a client you have actually
      # confirmed accepts the JSON format at the version your users run;
      # see internal/httpapi/subscription.go's detectSubscriptionFormat
      # doc comment for why guessing this wrong is not cosmetic.
      USE_CUSTOM_JSON_DEFAULT: ${USE_CUSTOM_JSON_DEFAULT:-false}
      USE_CUSTOM_JSON_FOR_V2RAYN: ${USE_CUSTOM_JSON_FOR_V2RAYN:-false}
      USE_CUSTOM_JSON_FOR_V2RAYNG: ${USE_CUSTOM_JSON_FOR_V2RAYNG:-false}
      USE_CUSTOM_JSON_FOR_STREISAND: ${USE_CUSTOM_JSON_FOR_STREISAND:-false}
      USE_CUSTOM_JSON_FOR_HAPP: ${USE_CUSTOM_JSON_FOR_HAPP:-false}
      USE_CUSTOM_JSON_FOR_NPVTUNNEL: ${USE_CUSTOM_JSON_FOR_NPVTUNNEL:-false}
      # Which config is emptier: every config name in a subscription gets its
      # live load appended (`🇩🇪 Germany 🟢 23%`) when the nodes report it.
      # CAPACITY is the number of concurrent connections on one config that
      # counts as 100%; SORT_BY_LOAD lists a user's configs least loaded first
      # instead of in the Hosts page order (see .env.prod.example).
      CONFIG_LOAD_INDICATOR: ${CONFIG_LOAD_INDICATOR:-true}
      CONFIG_LOAD_CAPACITY: ${CONFIG_LOAD_CAPACITY:-1000}
      CONFIG_SORT_BY_LOAD: ${CONFIG_SORT_BY_LOAD:-false}
    volumes:
      - ./templates:/app/templates:ro

  backend:
    image: ${RAPIDO_IMAGE:-ghcr.io/legendary1205/rapido-go-panel}:${RAPIDO_TAG:-latest}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # No published port at all - this role is not meant to receive traffic
    # directly, only the "api" role (fronted by caddy) is (see the README's
    # architecture section on why there are two roles to begin with).
    environment:
      ROLE: backend
      DATABASE_URL: postgres://rapido:${POSTGRES_PASSWORD:-rapido}@postgres:5432/rapido?sslmode=disable
      REDIS_ADDR: redis:6379
      SUDO_USERNAME: ${SUDO_USERNAME:-admin}
      SUDO_PASSWORD: ${SUDO_PASSWORD:?set SUDO_PASSWORD in your .env file - this is the one-time bootstrap login, see the README}
      PUBLIC_IP: ${PUBLIC_IP:-}
      USAGE_RETENTION_DAYS: ${USAGE_RETENTION_DAYS:-90}

  # The panel binary itself has no built-in TLS (no reverse-proxy-free
  # HTTPS listener like the Python-era panel's UVICORN_SSL_CERTFILE/
  # UVICORN_SSL_KEYFILE) - Caddy in front of it is what makes "give it a
  # domain, get a working https:// URL" true, the same promise rapido.sh
  # makes for the Python panel (there via a manual certbot dance; here via
  # Caddy's own built-in automatic HTTPS, zero certbot orchestration
  # needed - rapido-go.sh only ever writes the Caddyfile, Caddy does the
  # rest, including renewal).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - panel

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
