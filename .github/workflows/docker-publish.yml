name: Build and publish Docker images

# Pushes ghcr.io/<owner>/rapido-go-panel and rapido-go-node on every push
# to master, tagged both :latest and :<short-sha> - this is the ONLY way
# the images referenced by docker-compose.prod.yml/docker-compose.node.yml
# get built; there is no local/manual build step for a real deployment.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  installer-scripts:
    # The installer is shipped by curl, not by the image, so nothing else in
    # this pipeline would ever catch a break in it. See scripts/installer_test.sh
    # for the specific failure this guards.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n rapido-go.sh && bash -n rapido-go-node.sh && bash -n migrate-from-rapido.sh
      - run: bash scripts/installer_test.sh

  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: rapido-go-panel
            dockerfile: docker/Dockerfile.panel
          - image: rapido-go-node
            dockerfile: docker/Dockerfile.node
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
